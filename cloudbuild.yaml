# Builds the NoBrainy app and migrator images and pushes them to Artifact
# Registry. scripts/deploy.sh uses this when no local Docker daemon exists.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_TAG=$(git rev-parse --short HEAD),_ENVIRONMENT=production
substitutions:
  _REGION: asia-south1
  _TAG: manual
  _ENVIRONMENT: production
  _NEXT_PUBLIC_GA_ID: ''
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
steps:
  - id: app
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_GA_ID=${_NEXT_PUBLIC_GA_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nobrainy/app:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nobrainy/app:${_ENVIRONMENT}-latest
      - .
  - id: migrator
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=migrator
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nobrainy/migrator:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nobrainy/migrator:${_ENVIRONMENT}-latest
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nobrainy/app:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nobrainy/app:${_ENVIRONMENT}-latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nobrainy/migrator:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nobrainy/migrator:${_ENVIRONMENT}-latest
